name: Build and smoke-test Android APK

on:
  push:
    branches:
      - main
      - fix/android-release-apk
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://iommijhcnfcocjniwmei.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_IZZYLo2mNNuJLbVoJSA5oA_2zcU0r6U
      EXPO_PUBLIC_API_BASE_URL: https://disaster-response-system-zhe5.onrender.com
      EXPO_PUBLIC_CARTO_KEY: cb1_4p59_1_1724a73fada656b56f5241c2
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify Expo dependencies
        run: npx expo install --check

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Assemble x86_64 emulator APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 -Pandroid.enableMinifyInReleaseBuilds=true -Pandroid.enableShrinkResourcesInReleaseBuilds=true --no-daemon

      - name: Preserve emulator APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Kalinga-Rescuer-emulator.apk

      - name: Assemble ARM phone APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a -Pandroid.enableMinifyInReleaseBuilds=true -Pandroid.enableShrinkResourcesInReleaseBuilds=true --no-daemon

      - name: Verify phone APK bundle, architectures, and size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          apk = Path("android/app/build/outputs/apk/release/app-release.apk")
          with ZipFile(apk) as archive:
              entries = archive.namelist()
              if "assets/index.android.bundle" not in entries:
                  raise SystemExit("Release APK is missing assets/index.android.bundle")
              abis = {
                  entry.split("/")[1]
                  for entry in entries
                  if entry.startswith("lib/") and entry.count("/") >= 2
              }
              expected = {"armeabi-v7a", "arm64-v8a"}
              if abis != expected:
                  raise SystemExit(f"Expected only phone ARM libraries; found {sorted(abis)}")
          size = apk.stat().st_size
          if size >= 70 * 1024 * 1024:
              raise SystemExit(f"Phone APK is too large: {size} bytes (limit: 70 MiB)")
          print(f"Verified ARM APK ({', '.join(sorted(abis))}): {size} bytes")
          PY
          cp android/app/build/outputs/apk/release/app-release.apk Kalinga-Rescuer-arm.apk

      - name: Launch release APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 scripts/run_android_startup_smoke.py

      - name: Upload Android startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalinga-rescuer-startup-qa
          path: qa-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalinga-rescuer-arm-apk
          path: Kalinga-Rescuer-arm.apk
          if-no-files-found: error
          retention-days: 14
