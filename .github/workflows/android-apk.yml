name: Build Android APK

on:
  push:
    branches:
      - main
      - fix/android-release-apk
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://iommijhcnfcocjniwmei.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_IZZYLo2mNNuJLbVoJSA5oA_2zcU0r6U
      EXPO_PUBLIC_API_BASE_URL: https://disaster-response-system-zhe5.onrender.com
      EXPO_PUBLIC_CARTO_KEY: cb1_4p59_1_1724a73fada656b56f5241c2
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify Expo dependencies
        run: npx expo install --check

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Assemble bundled ARM64 release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -Pandroid.enableMinifyInReleaseBuilds=true -Pandroid.enableShrinkResourcesInReleaseBuilds=true --no-daemon

      - name: Verify embedded bundle, architecture, and size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          apk = Path("android/app/build/outputs/apk/release/app-release.apk")
          with ZipFile(apk) as archive:
              entries = archive.namelist()
              if "assets/index.android.bundle" not in entries:
                  raise SystemExit("Release APK is missing assets/index.android.bundle")
              abis = {
                  entry.split("/")[1]
                  for entry in entries
                  if entry.startswith("lib/") and entry.count("/") >= 2
              }
              if abis != {"arm64-v8a"}:
                  raise SystemExit(f"Expected ARM64-only native libraries; found {sorted(abis)}")
          size = apk.stat().st_size
          if size >= 100 * 1024 * 1024:
              raise SystemExit(f"APK remains too large: {size} bytes (limit: 100 MiB)")
          print(f"Verified bundled ARM64 APK: {size} bytes")
          PY

      - name: Name APK artifact
        run: cp android/app/build/outputs/apk/release/app-release.apk Kalinga-Rescuer-arm64.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kalinga-rescuer-arm64-apk
          path: Kalinga-Rescuer-arm64.apk
          if-no-files-found: error
          retention-days: 14
