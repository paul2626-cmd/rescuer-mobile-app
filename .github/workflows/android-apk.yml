name: Build and smoke-test Android APK

on:
  push:
    branches:
      - main
      - fix/android-release-apk
    paths-ignore:
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://iommijhcnfcocjniwmei.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_IZZYLo2mNNuJLbVoJSA5oA_2zcU0r6U
      EXPO_PUBLIC_API_BASE_URL: https://disaster-response-system-zhe5.onrender.com
      EXPO_PUBLIC_CARTO_KEY: cb1_4p59_1_1724a73fada656b56f5241c2
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Verify Expo dependencies
        run: npx expo install --check

      - name: Typecheck
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Assemble bundled release APK
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64 -Pandroid.enableMinifyInReleaseBuilds=true -Pandroid.enableShrinkResourcesInReleaseBuilds=true --no-daemon

      - name: Verify embedded bundle, architectures, and size
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          apk = Path("android/app/build/outputs/apk/release/app-release.apk")
          with ZipFile(apk) as archive:
              entries = archive.namelist()
              if "assets/index.android.bundle" not in entries:
                  raise SystemExit("Release APK is missing assets/index.android.bundle")
              abis = {
                  entry.split("/")[1]
                  for entry in entries
                  if entry.startswith("lib/") and entry.count("/") >= 2
              }
              expected = {"armeabi-v7a", "arm64-v8a", "x86_64"}
              if abis != expected:
                  raise SystemExit(f"Expected ARM phone and x86_64 emulator libraries; found {sorted(abis)}")
          size = apk.stat().st_size
          if size >= 100 * 1024 * 1024:
              raise SystemExit(f"APK remains too large: {size} bytes (limit: 100 MiB)")
          print(f"Verified bundled APK ({', '.join(sorted(abis))}): {size} bytes")
          PY
          cp android/app/build/outputs/apk/release/app-release.apk Kalinga-Rescuer-arm.apk

      - name: Launch release APK in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            mkdir -p qa-output
            adb install -r Kalinga-Rescuer-arm.apk
            adb shell pm clear com.rescuer.mobile
            adb logcat -c
            adb shell cmd package resolve-activity --brief -a android.intent.action.MAIN -c android.intent.category.LAUNCHER -p com.rescuer.mobile || true
            adb shell am start -n com.rescuer.mobile/.MainActivity || true
            sleep 10
            adb shell pidof com.rescuer.mobile > qa-output/pid.txt || true
            adb exec-out screencap -p > qa-output/startup.png
            adb shell uiautomator dump /sdcard/kalinga-ui.xml > qa-output/uiautomator.txt 2>&1 || true
            adb exec-out cat /sdcard/kalinga-ui.xml > qa-output/ui.xml 2>/dev/null || true
            adb logcat -d -t 5000 > qa-output/logcat.txt
            python3 scripts/verify_android_startup.py qa-output/ui.xml qa-output/logcat.txt qa-output/pid.txt

      - name: Upload Android startup evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalinga-rescuer-startup-qa
          path: qa-output/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kalinga-rescuer-arm-apk
          path: Kalinga-Rescuer-arm.apk
          if-no-files-found: error
          retention-days: 14
